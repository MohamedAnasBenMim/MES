# PRE-COMMIT HOOKS CONFIGURATION
# --------------------------------
# HOW IT WORKS:
#   1. You run "pip install pre-commit" then "pre-commit install" (one-time setup)
#   2. After that, every time you run "git commit", these hooks run AUTOMATICALLY
#   3. If any hook fails (e.g., finds a private key), the commit is BLOCKED
#   4. Some hooks auto-fix issues (formatting), so you just re-add files and commit again

repos:
  # HOOK GROUP 1: Basic safety checks from the official pre-commit team
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace       # Removes useless spaces at end of lines
      - id: end-of-file-fixer         # Ensures every file ends with a newline
      - id: check-yaml                # Validates YAML syntax (docker-compose, CI files)
      - id: check-added-large-files   # Prevents accidentally committing huge files
        args: ['--maxkb=10000']       # Block files larger than 10MB
      - id: check-merge-conflict      # Catches forgotten merge conflict markers (<<<<<<<)
      - id: detect-private-key        # SECURITY: blocks commits containing SSH/RSA private keys

  # HOOK GROUP 2: Python code formatter (Black)
  # Black enforces consistent Python style automatically (indentation, quotes, spacing)
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        files: ^MES-Backend/          # Only format Python files inside MES-Backend/

  # HOOK GROUP 3: Python import sorter (isort)
  # Organizes import statements alphabetically and by type (stdlib, third-party, local)
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]
        files: ^MES-Backend/          # Only sort imports in MES-Backend/

  # HOOK GROUP 4: Frontend code formatter (Prettier)
  # Formats TypeScript, HTML, CSS, JSON files consistently
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, json, css, scss, html]
        exclude: ^MES-Frontend/node_modules/  # Skip node_modules (third-party code)
        language_version: system
