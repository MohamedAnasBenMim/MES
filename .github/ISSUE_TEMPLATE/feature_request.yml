name: Feature request
description: Propose an improvement to the MES platform
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which user or operational problem should this feature solve?
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Primary user role
      options:
        - Operator
        - Supervisor
        - Quality
        - Administrator
        - DevOps or operations
        - Multiple roles
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the desired behavior and acceptance criteria.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Technical or operational impact
      description: Note any Infor integration, migration, security, deployment, or compatibility considerations.
