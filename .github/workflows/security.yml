name: Security Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  secret-scan:
    name: Secret Scan with Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: Dependency Scan with Pip Audit and NPM Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Scan Python Dependencies
        run: pip-audit -r MES-Backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: MES-Frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd MES-Frontend
          npm ci

      - name: Scan NPM Dependencies
        run: |
          cd MES-Frontend
          npm audit --audit-level=high

  docker-image-scan:
    name: Docker Image Scan with Trivy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: docker build -t mes-backend:test ./MES-Backend

      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: mes-backend:test
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Build Frontend Image
        run: docker build -t mes-frontend:test ./MES-Frontend

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: mes-frontend:test
          severity: HIGH,CRITICAL
          exit-code: "1"
