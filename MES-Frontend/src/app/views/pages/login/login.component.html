<div
  class="bg-light dark:bg-transparent min-vh-100 d-flex flex-row align-items-center"
>
  <c-container breakpoint="md">
    <c-row class="justify-content-center">
      <c-col lg="10" xl="8">
        <c-card-group>
          <c-card class="p-4">
            <c-card-body>
              <form cForm (ngSubmit)="login()" #loginForm="ngForm">
                <h1>Login</h1>
                <p class="text-body-secondary">Sign In to your account</p>

                <c-input-group class="mb-3">
                  <span cInputGroupText>
                    <svg cIcon name="cilUser"></svg>
                  </span>
                  <input
                    autoComplete="username"
                    cFormControl
                    name="username"
                    [(ngModel)]="username"
                    placeholder="Username"
                    required
                  />
                </c-input-group>

                <c-input-group class="mb-4">
                  <span cInputGroupText>
                    <svg cIcon name="cilLockLocked"></svg>
                  </span>
                  <input
                    autoComplete="current-password"
                    cFormControl
                    name="password"
                    [(ngModel)]="password"
                    placeholder="Password"
                    type="password"
                    required
                  />
                </c-input-group>

                <c-row>
                  <c-col xs="6">
                    <button
                      cButton
                      class="px-4 text-white"
                      type="submit"
                      [disabled]="!loginForm.form.valid"
                      [ngStyle]="{
                        backgroundColor: '#00aeef',
                        borderColor: '#00aeef'
                      }"
                    >
                      Login
                    </button>
                  </c-col>

                  <c-col class="text-right" xs="6">
                    <button
                      cButton
                      class="px-0"
                      color="link"
                      type="button"
                      routerLink="/forget-password"
                    >
                      Forget password?
                    </button>
                  </c-col>
                </c-row>
              </form>
            </c-card-body>
          </c-card>

          <c-card
            [ngStyle]="{ 'minWidth.%': 44, backgroundColor: '#00aeef' }"
            class="py-5 text-white text-center"
          >
            <c-card-body>
              <div>
                <h2>Welcome Back!</h2>
                <p>
                  Please enter your credentials to log in. If you need help,
                  contact the administrator.
                </p>
              </div>
            </c-card-body>
          </c-card>
        </c-card-group>
      </c-col>
    </c-row>
  </c-container>
</div>

<!-- Custom Error Modal -->
<div *ngIf="errorModalVisible" class="custom-modal-backdrop">
  <div class="custom-modal-box">
    <div class="custom-modal-header">
      <h4>{{ errorModalTitle }}</h4>
    </div>

    <div class="custom-modal-body">
      <p>{{ errorModalMessage }}</p>
    </div>

    <div class="custom-modal-footer">
      <button
        type="button"
        class="btn text-white"
        [ngStyle]="{
          backgroundColor: '#00aeef',
          borderColor: '#00aeef'
        }"
        (click)="closeErrorModal()"
      >
        OK
      </button>
    </div>
  </div>
</div>
