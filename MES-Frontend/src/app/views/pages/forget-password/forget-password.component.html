<div
  class="bg-light dark:bg-transparent min-vh-100 d-flex flex-row align-items-center"
>
  <c-container breakpoint="md">
    <c-row class="justify-content-center">
      <c-col lg="10" xl="8">
        <c-card-group>
          <c-card class="p-4">
            <c-card-body>
              <form cForm #forgetForm="ngForm">
                <h1>Forget Password</h1>

                <p class="text-body-secondary">
                  Enter your email address and we will send you a new password.
                </p>

                <c-input-group class="mb-4">
                  <span cInputGroupText>
                    <svg cIcon name="cilEnvelopeClosed"></svg>
                  </span>

                  <input
                    autoComplete="email"
                    cFormControl
                    name="email"
                    [(ngModel)]="email"
                    placeholder="Email address"
                    type="email"
                    required
                  />
                </c-input-group>

                <div *ngIf="message" class="alert alert-success" role="alert">
                  {{ message }}
                </div>

                <div
                  *ngIf="errorMessage"
                  class="alert alert-danger"
                  role="alert"
                >
                  {{ errorMessage }}
                </div>

                <c-row>
                  <c-col xs="6">
                    <button
                      cButton
                      class="px-4 text-white"
                      type="button"
                      [disabled]="!email || loading"
                      (click)="sendNewPassword()"
                      [ngStyle]="{
                        backgroundColor: '#00aeef',
                        borderColor: '#00aeef'
                      }"
                    >
                      {{ loading ? "Sending..." : "Send password" }}
                    </button>
                  </c-col>

                  <c-col class="text-right" xs="6">
                    <button
                      cButton
                      class="px-0"
                      color="link"
                      type="button"
                      routerLink="/login"
                    >
                      Back to login
                    </button>
                  </c-col>
                </c-row>
              </form>
            </c-card-body>
          </c-card>

          <c-card
            [ngStyle]="{ 'minWidth.%': 44, backgroundColor: '#00aeef' }"
            class="py-5 text-white text-center"
          >
            <c-card-body>
              <div>
                <h2>Password Help</h2>

                <p>
                  Enter the email linked to your account. A new password will be
                  generated and sent to your inbox.
                </p>
              </div>
            </c-card-body>
          </c-card>
        </c-card-group>
      </c-col>
    </c-row>
  </c-container>
</div>
