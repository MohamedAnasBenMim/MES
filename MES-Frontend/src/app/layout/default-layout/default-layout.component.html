<!--sidebar-->
<c-sidebar
  #sidebar1="cSidebar"
  class="d-print-none sidebar sidebar-fixed border-end"
  colorScheme="dark"
  id="sidebar1"
  visible
>
  <!-- <c-sidebar-header class="custom-sidebar-header">
    <c-sidebar-brand [routerLink]="[]" class="custom-sidebar-brand">
      <img
        src="assets/images/ZUM.png"
        class="sidebar-brand-full"
        height="32"
        alt="Logo"
      />
      <img
        src="assets/images/ZUM.png"
        class="sidebar-brand-narrow"
        height="32"
        alt="Logo Icon"
      />
    </c-sidebar-brand>
  </c-sidebar-header> -->

  <c-sidebar-header class="border-bottom">
    <c-sidebar-brand [routerLink]="[]">
      <svg
        [class]="{ icon: false }"
        cIcon
        class="sidebar-brand-full"
        height="32"
        name="logo"
        title="CoreUI Logo"
      ></svg>
      <svg
        cIcon
        class="sidebar-brand-narrow"
        height="32"
        name="signet"
        title="CoreUI Logo"
      ></svg>
    </c-sidebar-brand>
  </c-sidebar-header>

  <ng-scrollbar pointerEventsMethod="scrollbar" visibility="hover">
    <c-sidebar-nav [navItems]="navItems" dropdownMode="close" compact />
  </ng-scrollbar>

  @if (!sidebar1.narrow) {
  <c-sidebar-footer
    cSidebarToggle="sidebar1"
    class="border-top d-none d-lg-flex"
    toggle="unfoldable"
    style="cursor: pointer"
  >
    <button cSidebarToggler aria-label="Toggle sidebar fold"></button>
  </c-sidebar-footer>
  }
</c-sidebar>

<!--main-->
<div class="wrapper d-flex flex-column min-vh-100">
  <!--app-header-->
  <app-default-header
    [cShadowOnScroll]="'sm'"
    class="mb-4 d-print-none header header-sticky p-0 shadow-sm"
    position="sticky"
    sidebarId="sidebar1"
  />
  <!--app-body-->
  <div class="body flex-grow-1">
    <c-container breakpoint="lg" class="h-auto px-4">
      <router-outlet />
    </c-container>
  </div>
  <!--app footer-->
  <app-default-footer />
</div>
@if (idleWarningVisible) {
  <div
    class="idle-timeout-backdrop"
    role="presentation"
  >
    <div
      class="idle-timeout-modal"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="idle-timeout-title"
      aria-describedby="idle-timeout-description"
    >
      <div class="idle-timeout-icon">
        !
      </div>

      <h2 id="idle-timeout-title">
        Session Expiring
      </h2>

      <p id="idle-timeout-description">
        Your session will expire due to inactivity.
      </p>

      <p>
        Click
        <strong>Continue Session</strong>
        to remain logged in.
      </p>

      <div class="idle-countdown">
        Automatic logout in
        <strong>
          {{ idleCountdownDisplay }}
        </strong>
      </div>

      <button
        type="button"
        class="continue-session-button"
        (click)="continueSession()"
        [disabled]="isAutomaticLogoutRunning"
      >
        Continue Session
      </button>
    </div>
  </div>
}
